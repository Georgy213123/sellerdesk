name: sellerdesk

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sellerdesk
      POSTGRES_PASSWORD: sellerdesk
      POSTGRES_DB: sellerdesk
    ports:
      - "127.0.0.1:55101:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sellerdesk -d sellerdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sellerdesk:sellerdesk@postgres:5432/sellerdesk
      JWT_SECRET: ${JWT_SECRET:-demo-only-change-me-0123456789abcdef}
      DEMO_OPERATOR_PASSWORD: ${DEMO_OPERATOR_PASSWORD:-demo-password}
      MARKETPLACE_MODE: mock
      # У демо-данных фиксированные даты (конец октября 2026), поэтому окно разбора агента 90 дней, а не неделя.
      AGENT_PERIOD_DAYS: ${AGENT_PERIOD_DAYS:-90}
      # Claude API включается в .env: LLM_PROVIDER=anthropic и ключ. Ключа по умолчанию нет.
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-20}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      AGENT_TOKEN_BUDGET: ${AGENT_TOKEN_BUDGET:-60000}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-40}
      AGENT_LEASE_S: ${AGENT_LEASE_S:-120}
      AGENT_MAX_ATTEMPTS: ${AGENT_MAX_ATTEMPTS:-3}
      AGENT_RETRY_PAUSE_S: ${AGENT_RETRY_PAUSE_S:-60}
      AGENT_CLASSIFY_BUDGET_SHARE: ${AGENT_CLASSIFY_BUDGET_SHARE:-0.7}
      AGENT_BATCH_SIZE: ${AGENT_BATCH_SIZE:-20}
      AGENT_TOP_THEMES: ${AGENT_TOP_THEMES:-3}
      AGENT_MIN_CASES: ${AGENT_MIN_CASES:-2}
      MOCK_MARKETPLACE_DELAY_MS: ${MOCK_MARKETPLACE_DELAY_MS:-800}
      CORS_ORIGINS: http://localhost:5101
    ports:
      - "127.0.0.1:8101:8101"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5101:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
