openapi: 3.1.0
info:
  title: SellerDesk API
  description: 'Рабочее место оператора продавца на маркетплейсах: единая лента чатов,
    отзывы и вопросы, AI-черновики и шаблоны ответов. Демо: площадки и LLM — заглушки.'
  version: 0.5.0
paths:
  /api/health:
    get:
      tags:
      - service
      summary: Health
      operationId: health_api_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
  /api/auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/me:
    get:
      tags:
      - auth
      summary: Me
      operationId: me_api_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      security:
      - HTTPBearer: []
  /api/chats:
    get:
      tags:
      - chats
      summary: List Chats
      description: Единая лента чатов всех площадок, свежие сверху. Сортировка по
        UTC-времени (BUG-02).
      operationId: list_chats_api_chats_get
      security:
      - HTTPBearer: []
      parameters:
      - name: marketplace
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - wildberries
            - ozon
            - yandex_market
            type: string
          - type: 'null'
          title: Marketplace
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - new
            - in_progress
            - answered
            type: string
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatList'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Unauthorized
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/chats/{chat_id}:
    get:
      tags:
      - chats
      summary: Get Chat
      operationId: get_chat_api_chats__chat_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: chat_id
        in: path
        required: true
        schema:
          type: integer
          title: Chat Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatOut'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/chats/{chat_id}/reply:
    post:
      tags:
      - chats
      summary: Reply To Chat
      operationId: reply_to_chat_api_chats__chat_id__reply_post
      security:
      - HTTPBearer: []
      parameters:
      - name: chat_id
        in: path
        required: true
        schema:
          type: integer
          title: Chat Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 64
          description: Один ключ на одно намерение ответить. Повтор с тем же ключом
            не отправит второй ответ.
          title: Idempotency-Key
        description: Один ключ на одно намерение ответить. Повтор с тем же ключом
          не отправит второй ответ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplyOut'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Unprocessable Entity
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Bad Gateway
  /api/chats/{chat_id}/ai-draft:
    post:
      tags:
      - chats
      summary: Chat Ai Draft
      description: Черновик от LLM-провайдера. Сохраняется в карточке, покупателю
        не уходит.
      operationId: chat_ai_draft_api_chats__chat_id__ai_draft_post
      security:
      - HTTPBearer: []
      parameters:
      - name: chat_id
        in: path
        required: true
        schema:
          type: integer
          title: Chat Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftOut'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Conflict
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Service Unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/chats/{chat_id}/template-reply:
    post:
      tags:
      - chats
      summary: Chat Template Reply
      description: Автоответ по шаблону. Если переменная не подставилась — не отправляет,
        а кладёт черновик с причиной.
      operationId: chat_template_reply_api_chats__chat_id__template_reply_post
      security:
      - HTTPBearer: []
      parameters:
      - name: chat_id
        in: path
        required: true
        schema:
          type: integer
          title: Chat Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 64
          description: Один ключ на одно намерение ответить. Повтор с тем же ключом
            не отправит второй ответ.
          title: Idempotency-Key
        description: Один ключ на одно намерение ответить. Повтор с тем же ключом
          не отправит второй ответ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateReplyIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateReplyOut'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Conflict
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Bad Gateway
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/feedback:
    get:
      tags:
      - feedback
      summary: List Feedback
      operationId: list_feedback_api_feedback_get
      security:
      - HTTPBearer: []
      parameters:
      - name: kind
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(review|question)$
          - type: 'null'
          title: Kind
      - name: marketplace
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - wildberries
            - ozon
            - yandex_market
            type: string
          - type: 'null'
          title: Marketplace
      - name: rating
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 5
            minimum: 1
          - type: 'null'
          title: Rating
      - name: answered
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Answered
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackList'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Unauthorized
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/feedback/{feedback_id}/answer:
    post:
      tags:
      - feedback
      summary: Answer Feedback
      operationId: answer_feedback_api_feedback__feedback_id__answer_post
      security:
      - HTTPBearer: []
      parameters:
      - name: feedback_id
        in: path
        required: true
        schema:
          type: integer
          title: Feedback Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackOut'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Unprocessable Entity
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Bad Gateway
  /api/feedback/{feedback_id}/ai-draft:
    post:
      tags:
      - feedback
      summary: Feedback Ai Draft
      operationId: feedback_ai_draft_api_feedback__feedback_id__ai_draft_post
      security:
      - HTTPBearer: []
      parameters:
      - name: feedback_id
        in: path
        required: true
        schema:
          type: integer
          title: Feedback Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftOut'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Not Found
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Service Unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/feedback/{feedback_id}/template-reply:
    post:
      tags:
      - feedback
      summary: Feedback Template Reply
      operationId: feedback_template_reply_api_feedback__feedback_id__template_reply_post
      security:
      - HTTPBearer: []
      parameters:
      - name: feedback_id
        in: path
        required: true
        schema:
          type: integer
          title: Feedback Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateReplyIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateReplyOut'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Conflict
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Bad Gateway
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/templates:
    get:
      tags:
      - templates
      summary: List Templates
      operationId: list_templates_api_templates_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TemplateOut'
                type: array
                title: Response List Templates Api Templates Get
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      security:
      - HTTPBearer: []
    post:
      tags:
      - templates
      summary: Create Template
      operationId: create_template_api_templates_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/sync:
    post:
      tags:
      - sync
      summary: Start Sync
      description: Ставит задачу синхронизации и сразу отвечает. Площадку не ждём
        — интерфейс читает из БД.
      operationId: start_sync_api_sync_post
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '200':
          description: Задача уже в очереди или идёт — возвращается она же
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobOut'
      security:
      - HTTPBearer: []
  /api/sync/latest:
    get:
      tags:
      - sync
      summary: Latest Sync
      operationId: latest_sync_api_sync_latest_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/SyncJobOut'
                - type: 'null'
                title: Response Latest Sync Api Sync Latest Get
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      security:
      - HTTPBearer: []
  /api/sync/{job_id}:
    get:
      tags:
      - sync
      summary: Get Sync
      operationId: get_sync_api_sync__job_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobOut'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/agent/runs:
    get:
      tags:
      - agent
      summary: List Runs
      operationId: list_runs_api_agent_runs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AgentRunOut'
                type: array
                title: Response List Runs Api Agent Runs Get
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      security:
      - HTTPBearer: []
    post:
      tags:
      - agent
      summary: Start Run
      description: 'Ставит прогон и сразу отвечает. Разбор идёт в фоне, результат
        — в списке прогонов и предложений.


        Если активный прогон брошен (аренда истекла), возобновляет его и отвечает
        202 с прежним id.'
      operationId: start_run_api_agent_runs_post
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      security:
      - HTTPBearer: []
  /api/agent/runs/{run_id}:
    get:
      tags:
      - agent
      summary: Get Run
      operationId: get_run_api_agent_runs__run_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: integer
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunDetailOut'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/agent/proposals:
    get:
      tags:
      - agent
      summary: List Proposals
      operationId: list_proposals_api_agent_proposals_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - pending
            - approved
            - rejected
            type: string
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProposalOut'
                title: Response List Proposals Api Agent Proposals Get
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Unauthorized
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/agent/proposals/{proposal_id}/approve:
    post:
      tags:
      - agent
      summary: Approve Proposal
      description: Одобрить. Шаблон ответа будет создан; правка карточки только помечается
        одобренной.
      operationId: approve_proposal_api_agent_proposals__proposal_id__approve_post
      security:
      - HTTPBearer: []
      parameters:
      - name: proposal_id
        in: path
        required: true
        schema:
          type: integer
          title: Proposal Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalOut'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Unauthorized
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Conflict
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/agent/proposals/{proposal_id}/reject:
    post:
      tags:
      - agent
      summary: Reject Proposal
      operationId: reject_proposal_api_agent_proposals__proposal_id__reject_post
      security:
      - HTTPBearer: []
      parameters:
      - name: proposal_id
        in: path
        required: true
        schema:
          type: integer
          title: Proposal Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalOut'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Unauthorized
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Conflict
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Not Found
        '422':
          description: Validation Error
          content:
